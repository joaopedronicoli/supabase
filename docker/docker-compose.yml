version: "3.8"


services:
  db:
    image: supabase/postgres:15.8.1.085
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-supabase}"
      POSTGRES_USER: "${POSTGRES_USER:-supabase_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-supersecret}"
      POSTGRES_PORT: "5435"
      PGPORT: "5435"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - supabase_db_init:/docker-entrypoint-initdb.d
    command: >
      bash -c "rm -rf /var/lib/postgresql/data/* && docker-entrypoint.sh postgres -p 5435"
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - network_public


  auth:
    image: supabase/gotrue:v2.180.0
    depends_on:
      - db
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      GOTRUE_SITE_URL: "https://studio.pelg.com.br"
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/${POSTGRES_DB}"
      GOTRUE_JWT_SECRET: "e7c5c18d4f41b2f53f9320a6a2cf8ab18726f1f9d43f83ac527e3b80e03c9bb1"
      GOTRUE_DISABLE_SIGNUP: "false"
      API_EXTERNAL_URL: "https://api.pelg.com.br"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/supabase"
      JWT_SECRET: "e7c5c18d4f41b2f53f9320a6a2cf8ab18726f1f9d43f83ac527e3b80e03c9bb1"
      GOTRUE_JWT_ADMIN_ROLES: "service_role"
      GOTRUE_JWT_AUD: "authenticated"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      SECRET_KEY_BASE: "e7c5c18d4f41b2f53f9320a6a2cf8ab18726f1f9d43f83ac527e3b80e03c9bb1"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_auth.rule=Host(`api.pelg.com.br`)
        - traefik.http.routers.supabase_auth.entrypoints=websecure
        - traefik.http.routers.supabase_auth.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_auth.loadbalancer.server.port=9999
        - traefik.http.services.supabase_auth.loadbalancer.passHostHeader=true
    networks:
      - network_public

  realtime:
    image: supabase/realtime:v2.51.11
    depends_on:
      - db
    environment:
      DB_HOST: "db"
      DB_PORT: "5435"
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      PORT: "4000"
      SECRET_KEY_BASE: "${JWT_SECRET}"
      REPLICATION_MODE: "logical"
      JWT_SECRET: "jwtseguro_super"
      RLIMIT_NOFILE: "1048576"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_realtime.rule=Host(`realtime.pelg.com.br`)
        - traefik.http.routers.supabase_realtime.entrypoints=websecure
        - traefik.http.routers.supabase_realtime.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_realtime.loadbalancer.server.port=4000
        - traefik.http.services.supabase_realtime.loadbalancer.passHostHeader=true
    networks:
      - network_public

  storage:
    image: supabase/storage-api:v1.28.0
    depends_on:
      - db
      - auth
    environment:
      ANON_KEY: "${ANON_KEY}"
      SERVICE_KEY: "${SERVICE_KEY}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/${POSTGRES_DB}"
      PGOPTIONS: "-c search_path=storage,public"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: "s3"
      REGION: "us-east-1"
      BUCKET_NAME: "supabase-bucket"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
      AWS_ENDPOINT: "http://localhost:4569"
      PORT: "5000"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_storage.rule=Host(`storage.pelg.com.br`)
        - traefik.http.routers.supabase_storage.entrypoints=websecure
        - traefik.http.routers.supabase_storage.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_storage.loadbalancer.server.port=5000
        - traefik.http.services.supabase_storage.loadbalancer.passHostHeader=true
    networks:
      - network_public

  meta:
    image: supabase/postgres-meta:v0.91.6
    depends_on:
      - db
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: "db"
      PG_META_DB_PORT: "5435"
      PG_META_DB_USER: "${POSTGRES_USER}"
      PG_META_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      PG_META_DB_NAME: "${POSTGRES_DB}"
      PG_META_DISABLE_TELEMETRY: "true"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_meta.rule=Host(`meta.pelg.com.br`)
        - traefik.http.routers.supabase_meta.entrypoints=websecure
        - traefik.http.routers.supabase_meta.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_meta.loadbalancer.server.port=8080
        - traefik.http.services.supabase_meta.loadbalancer.passHostHeader=true
    networks:
      - network_public

  rest:
    image: postgrest/postgrest:v13.0.7
    depends_on:
      - db
    environment:
      PGRST_DB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/${POSTGRES_DB}"
      PGRST_DB_SCHEMAS: "public,storage,graphql_public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      PGRST_SERVER_PORT: "3001"
      PGRST_DB_POOL: "10"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_rest.rule=Host(`rest.pelg.com.br`)
        - traefik.http.routers.supabase_rest.entrypoints=websecure
        - traefik.http.routers.supabase_rest.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_rest.loadbalancer.server.port=3001
        - traefik.http.services.supabase_rest.loadbalancer.passHostHeader=true
    networks:
      - network_public

  supavisor:
    image: supabase/supavisor:2.7.0
    depends_on:
      - db
    environment:
      SUPAVISOR_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/${POSTGRES_DB}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/supabase"
      SECRET_KEY_BASE: "e7c5c18d4f41b2f53f9320a6a2cf8ab18726f1f9d43f83ac527e3b80e03c9bb1"
      VAULT_ENCRYPTION_KEY: "e7c5c18d4f41b2f53f9320a6a2cf8ab18726f1f9d43f83ac527e3b80e03c9bb1"
      PORT: "6543"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.tcp.routers.supabase_supavisor.rule=HostSNI(`supavisor.pelg.com.br`)
        - traefik.tcp.routers.supabase_supavisor.entrypoints=pg
        - traefik.tcp.services.supabase_supavisor.loadbalancer.server.port=6543
    networks:
      - network_public

  vector:
    image: timberio/vector:0.28.1-alpine
    networks:
      - network_public

  studio:
    image: supabase/studio:2025.10.01-sha-8460121
    depends_on:
      - rest
      - auth
      - meta
      - storage
    environment:
      STUDIO_PG_META_URL: "https://meta.pelg.com.br"
      NEXT_PUBLIC_API_URL: "https://studio.pelg.com.br"
      NEXT_PUBLIC_SUPABASE_URL: "https://rest.pelg.com.br"
      NEXT_PUBLIC_DISABLE_SIGNUP: "false"
      NEXT_PUBLIC_ENABLE_LOGS: "true"
      SUPABASE_PUBLIC_URL: "https://rest.pelg.com.br"
      SUPABASE_SERVICE_KEY: "${SERVICE_KEY}"
      SUPABASE_ANON_KEY: "${ANON_KEY}"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_studio.rule=Host(`studio.pelg.com.br`)
        - traefik.http.routers.supabase_studio.entrypoints=websecure
        - traefik.http.routers.supabase_studio.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_studio.loadbalancer.server.port=3000
        - traefik.http.services.supabase_studio.loadbalancer.passHostHeader=true
    networks:
      - network_public

  analytics:
    image: supabase/logflare:1.22.6
    depends_on:
      - db
    environment:
      LOGFLARE_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/${POSTGRES_DB}"
      LOGFLARE_API_KEY: "${LOGFLARE_API_KEY:-local}"
      LOGFLARE_PORT: "4000"
      SECRET_KEY_BASE: "${JWT_SECRET}"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_analytics.rule=Host(`analytics.pelg.com.br`)
        - traefik.http.routers.supabase_analytics.entrypoints=websecure
        - traefik.http.routers.supabase_analytics.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_analytics.loadbalancer.server.port=4000
        - traefik.http.services.supabase_analytics.loadbalancer.passHostHeader=true
    networks:
      - network_public

  functions:
    image: supabase/edge-runtime:v1.69.6
    depends_on:
    - db
    command: start --main-service main
    volumes:
    - /data/compose/69/docker/docker/volumes/functions:/home/deno/functions:rw
    environment:
      SUPABASE_URL: "https://rest.pelg.com.br"
      SUPABASE_ANON_KEY: "${ANON_KEY}"
      SUPABASE_SERVICE_ROLE_KEY: "${SERVICE_KEY}"
      POSTGRES_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5435/${POSTGRES_DB}"
      EDGE_FUNCTIONS_PORT: "8081"
      RLIMIT_NOFILE: "1048576"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_functions.rule=Host(`functions.pelg.com.br`)
        - traefik.http.routers.supabase_functions.entrypoints=websecure
        - traefik.http.routers.supabase_functions.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_functions.loadbalancer.server.port=8081
        - traefik.http.services.supabase_functions.loadbalancer.passHostHeader=true
    networks:
      - network_public

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    environment:
      IMGPROXY_BIND: ":8082"
      IMGPROXY_KEY: "${IMGPROXY_KEY}"
      IMGPROXY_SALT: "${IMGPROXY_SALT}"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.supabase_imgproxy.rule=Host(`imgproxy.pelg.com.br`)
        - traefik.http.routers.supabase_imgproxy.entrypoints=websecure
        - traefik.http.routers.supabase_imgproxy.tls.certresolver=letsencryptresolver
        - traefik.http.services.supabase_imgproxy.loadbalancer.server.port=8082
        - traefik.http.services.supabase_imgproxy.loadbalancer.passHostHeader=true
    networks:
      - network_public

networks:
  network_public:
    external: true

volumes:
  supabase_db_data:
    external: false
  supabase_db_init:
    external: false
